[workspace]
resolver = "2"
members = ["server"]
default-members = ["server"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.86"
license = "AGPL-3.0-only"

[workspace.dependencies]
bytes = "=1.12.1"
http = "=1.4.2"
http-body-util = "=0.1.4"
hyper = { version = "=1.10.1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "=3.27.0"
tokio = { version = "=1.53.0", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
